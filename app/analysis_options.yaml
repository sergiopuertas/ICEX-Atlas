include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 100

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/app_localizations*.dart"
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Ver docs/decisiones.md (D-015): app, no paquete público.
    public_member_api_docs: ignore

linter:
  rules:
    lines_longer_than_80_chars: false   # page_width 100 con `dart format`
    # D-015: mantenemos la sintaxis clásica de constructores (Class(...)), la que usa todo
    # el ecosistema Flutter; la abreviada de Dart 3.13 aún no es la convención.
    unnecessary_type_name_in_constructor: false
    unnecessary_const_in_enum_constructor: false
