# Despliegue del backend (migraciones + Edge Functions) a Supabase.
# Manual y protegido por el entorno de GitHub (aprobación obligatoria para "production").
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-backend-${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Migraciones pendientes (revisar en el log antes de aprobar producción)
        run: supabase db push --dry-run
      - name: Aplicar migraciones
        run: supabase db push
      - name: Edge Functions
        run: |
          for fn in orientador orientador-indexer push-dispatcher media-upload account-delete membership-sync; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done
