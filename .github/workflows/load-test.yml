# Prueba de carga contra el proyecto de Supabase «carga» (NUNCA el de la beta).
# Prepara cuentas, sube por escalones de usuarios simultáneos, mide y borra lo creado.
# Antes: crear el proyecto gratuito «icex-atlas-carga» y desplegarlo con «Deploy backend → carga».
# Informe: en el resumen de la ejecución y como artefacto. Guía: docs/beta.md → Prueba de carga.
name: Load test

on:
  workflow_dispatch:
    inputs:
      escalones:
        description: Usuarios simultáneos por escalón
        type: string
        default: '50,200,500,1000'
      segundos:
        description: Segundos que dura cada escalón
        type: string
        default: '120'
      realtime:
        description: Fracción de usuarios con WebSocket abierto (1 = todos, como la app en primer plano)
        type: string
        default: '1'
      limpiar:
        description: Solo borrar cuentas que quedaran de una prueba interrumpida
        type: boolean
        default: false

permissions:
  contents: read

concurrency: load-test

jobs:
  carga:
    runs-on: ubuntu-latest
    environment: carga
    timeout-minutes: 75
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CARGA_CONFIRMAR: ${{ secrets.SUPABASE_PROJECT_REF }}
      ESCALONES: ${{ inputs.escalones }}
      SEGUNDOS_ESCALON: ${{ inputs.segundos }}
      REALTIME: ${{ inputs.realtime }}
      INFORME: carga-informe.md
    steps:
      - uses: actions/checkout@v4
      - name: Secretos presentes
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            [ -n "${!v}" ] || { echo "::error::Falta $v en el entorno 'carga' (ver docs/beta.md)"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install "aiohttp>=3.10,<4"
      - name: Prueba
        run: python3 scripts/load/carga.py ${{ inputs.limpiar && '--limpiar' || '' }}
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.limpiar
        with:
          name: informe-carga-${{ github.run_number }}
          path: carga-informe.md
          if-no-files-found: ignore
