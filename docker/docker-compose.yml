# Servicios auxiliares de desarrollo local (Supabase se levanta con `supabase start`).
#
# Supabase Auth exige que el issuer OIDC sea HTTPS y que NO resuelva a una IP privada
# (protección SSRF). Por eso el IdP de pruebas vive en una red Docker con el rango de
# documentación TEST-NET-3 (203.0.113.0/24, RFC 5737), con el nombre idp.icex-atlas.test.
# scripts/setup-local.sh conecta el contenedor de Auth a esta red y le hace confiar en la
# CA de desarrollo. En el host, idp.icex-atlas.test → 127.0.0.1 (puerto 9010 publicado).
services:
  oidc:
    build: ./oidc-provider
    image: icex-atlas/oidc-dev:local
    container_name: icex-atlas-oidc
    ports:
      - "9010:9010"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-https://idp.icex-atlas.test:9010}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-supabase-local}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-supabase-local-secret}
      OIDC_CERT_DIR: /certs
    volumes:
      - ./certs:/certs:ro
    networks:
      idpnet:
        ipv4_address: 203.0.113.10
        aliases: [idp.icex-atlas.test]
    restart: unless-stopped

networks:
  idpnet:
    name: icex-atlas-idpnet
    ipam:
      config:
        - subnet: 203.0.113.0/24
